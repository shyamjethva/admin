<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search UI</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-900 text-white">

    <!-- Top Navbar -->
    <header class="flex items-center justify-between px-6 py-3 border-b border-gray-700">
        <h1 class="text-xl font-bold text-orange-500">MySearch</h1>

        <input type="text" placeholder="Search here..."
            class="w-1/2 px-4 py-2 rounded bg-gray-800 border border-gray-700 focus:outline-none" />

        <div>
            <button class="px-3 py-1 bg-gray-800 rounded">Login</button>
        </div>
    </header>

    <!-- Tabs -->
    <div class="flex gap-6 px-10 py-4 border-b border-gray-700 text-gray-400">
        <button class="text-white border-b-2 border-blue-500 pb-1">All</button>
        <button>Images</button>
        <button>Videos</button>
        <button>News</button>
    </div>

    <!-- Main Layout -->
    <div class="grid grid-cols-3 gap-8 px-10 py-6">

        <!-- Search Results -->
        <div class="col-span-2 space-y-6">

            <div class="bg-gray-800 p-4 rounded">
                <h2 class="text-blue-400 text-lg">Your Result Title</h2>
                <p class="text-gray-400 mt-2">
                    Here you can place your content, description or link result.
                </p>
            </div>

            <div class="bg-gray-800 p-4 rounded">
                <h2 class="text-blue-400 text-lg">Another Result</h2>
                <p class="text-gray-400 mt-2">
                    Replace this with your dynamic data.
                </p>
            </div>

        </div>

        <!-- Right Side Preview -->
        <div class="bg-gray-800 p-4 rounded">
            <h3 class="text-lg font-semibold mb-3">Preview</h3>
            <img src="https://via.placeholder.com/300" class="rounded mb-3">
            <p class="text-gray-400 text-sm">
                Side panel content or information.
            </p>
        </div>

    </div>

</body>

</html>
